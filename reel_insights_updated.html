<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reel insights</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #0c1014; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: contain;
  }
  .stage {
    max-width: 719px; width: 100%; margin: 0 auto; background: #0c1014;
    height: 100vh; overflow-y: auto; overflow-x: hidden; position: relative;
    overflow-anchor: none;
    -webkit-overflow-scrolling: touch;
    container-type: inline-size;
  }
  .topbar {
    position: sticky; top: 0; z-index: 30; width: 100%; display: block;
    background: #0c1014;
  }
  .topbar img { width: 100%; display: block; }
  .scrollhead img { width: 100%; display: block; }
  .tabs-wrap {
    position: sticky; top: 0; z-index: 20; width: 100%; background: #0c1014;
  }
  .tabs-wrap img { width: 100%; display: block; }
  .tab-hotspots {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .tab-hit {
    position: absolute; top: 0; height: 100%; cursor: pointer;
    outline: none; user-select: none;
  }
  .tab-hit[data-tab="overview"]   { left: 0%;   width: 33%; }
  .tab-hit[data-tab="engagement"] { left: 33%;  width: 34%; }
  .tab-hit[data-tab="audience"]   { left: 67%;  width: 33%; }

  .underline {
    position: absolute; top: 95.45%; height: 4.55%; width: 20.03%; background: #f8f9f9;
    border-radius: 2px;
    transition: left .25s ease;
    z-index: 2;
  }
  .underline[data-active="overview"]   { left: 6.68%; }
  .underline[data-active="engagement"] { left: 40.06%; }
  .underline[data-active="audience"]   { left: 73.44%; }

  .body-stack { position: relative; width: 100%; }
  .body-region { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .body-region img { width: 100%; display: block; }
  .body-region.hidden { visibility: hidden; pointer-events: none; }

  .skeleton-overlay {
    position: absolute; inset: 0; width: 100%; height: 100%; min-height: 100%;
    background: #0c1014; z-index: 50; overflow: hidden;
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  .skeleton-overlay.active { opacity: 1; }
  .skeleton-block {
    position: absolute; background: #1f242a; border-radius: 2.2cqw;
  }
  .skeleton-bar {
    position: absolute; background: #1f242a; border-radius: 1cqw;
  }
  /* Keep loading headings as crops of the original screen image.
     Do not recreate them with CSS text: that changes the font size/weight. */
  .skeleton-heading-img {
    position: absolute;
    background-repeat: no-repeat;
    background-size: 100cqw auto;
    background-origin: border-box;
    background-clip: border-box;
    image-rendering: auto;
    pointer-events: none;
  }
  .skeleton-shimmer {
    position: absolute; top: 0; left: -60%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    animation: skeleton-sweep 1.1s ease-in-out infinite;
  }
  @keyframes skeleton-sweep {
    0% { left: -60%; }
    100% { left: 140%; }
  }


  .scrollhead { position: relative; }
  .header-skeleton {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 40; pointer-events: none; opacity: 0; transition: opacity .15s ease;
  }
  .header-skeleton.active { opacity: 1; }
  .count-pill {
    position: absolute; top: 71.8cqw; width: 6.1cqw; height: 3.2cqw;
    background: #1f242a; border-radius: 1.1cqw; overflow: hidden;
  }

  .audience-top { position: relative; width: 100%; }
  .pill-active-bg {
    position: absolute; top: 85.607%; height: 11.215%; background: #2b3036;
    border-radius: 999px; z-index: 1; pointer-events: none;
  }
  .pill-hit { position: absolute; top: 83.925%; height: 14.393%; cursor: pointer; z-index: 2; }
  .pill-label {
    position: absolute; top: 85.607%; height: 11.215%; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    padding-top: 0.28cqw; /* optical centering of caps */
    color: #f8f9f9; font-weight: 700; font-size: 2.3cqw;
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0;
    pointer-events: none; white-space: nowrap;
  }

  .audience-detail-stack { position: relative; width: 100%; }
  .audience-panel { position: absolute; top: 0; left: 0; width: 100%; }
  .audience-panel.hidden { visibility: hidden; pointer-events: none; }
  .placeholder {
    color: #a2a9b4; font-size: 14px; padding: 40px 24px; text-align: center;
  }

  .chart-zone {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    touch-action: pan-y;
  }
  .scrub-dot {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2px solid #f53ef2;
    transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 5;
  }
  .scrub-tooltip {
    position: absolute; background: #25292e; color: #f8f9f9; font-size: 12px;
    padding: 4px 8px; border-radius: 6px; white-space: nowrap;
    transform: translate(-50%, -130%); pointer-events: none; display: none; z-index: 6;
    font-weight: 600;
  }
</style>
</head>

underline.setAttribute('data-active', 'overview');
let activeTab = 'overview';

// All three tabs stack on top of each other (position:absolute) and
// switching just toggles visibility - it never changes page height, so
// there is nothing for the scroll position to jump against.
function syncBodyStackHeight() {
  let maxH = 0;
  Object.values(bodies).forEach(b => {
    maxH = Math.max(maxH, b.scrollHeight);
  });
  bodyStack.style.height = maxH + 'px';
}

Promise.all(
  Array.from(document.querySelectorAll('.body-region img')).map(img =>
    img.decode ? img.decode().catch(() => {}) : Promise.resolve()
  )
).then(syncBodyStackHeight);

syncBodyStackHeight();
window.addEventListener('resize', syncBodyStackHeight);
window.addEventListener('load', syncBodyStackHeight);

hits.forEach(hit => {
  hit.addEventListener('click', () => {
    const tab = hit.dataset.tab;
    if (tab === activeTab) return;

    underline.setAttribute('data-active', tab);
    document.getElementById('tabsImg').src = TABS_IMG[tab];

    Object.values(bodies).forEach(b => b.classList.add('hidden'));
    bodies[tab].classList.remove('hidden');
    activeTab = tab;
  });
});

// --- Audience tab: Age / Country / Gender pill switcher ---
// Same idea as the top-level tabs: all three panels are stacked
// absolutely and locked to the tallest one's height, and switching
// is a plain, instant class toggle - no transition, no animation.
const pillActiveBg = document.getElementById('pillActiveBg');
const pillHits = document.querySelectorAll('.pill-hit');
const audienceDetailStack = document.getElementById('audienceDetailStack');
const audiencePanels = {
  age: document.getElementById('panel-age'),
  country: document.getElementById('panel-country'),
  gender: document.getElementById('panel-gender'),
};
let activePill = 'age';

function syncAudienceStackHeight() {
  let maxH = 0;
  Object.values(audiencePanels).forEach(p => {
    maxH = Math.max(maxH, p.scrollHeight);
  });
  audienceDetailStack.style.height = maxH + 'px';
}

function positionPillBg(hitEl) {
  pillActiveBg.style.left = hitEl.dataset.bgleft;
  pillActiveBg.style.width = hitEl.dataset.bgwidth;
}

// Initialize active-pill background to match the "age" pill on load.
const initialPillHit = document.querySelector('.pill-hit[data-pill="age"]');
if (initialPillHit) positionPillBg(initialPillHit);

Promise.all(
  Array.from(document.querySelectorAll('.audience-panel img')).map(img =>
    img.decode ? img.decode().catch(() => {}) : Promise.resolve()
  )
).then(() => {
  syncAudienceStackHeight();
  syncBodyStackHeight();
});
syncAudienceStackHeight();
window.addEventListener('resize', syncAudienceStackHeight);
window.addEventListener('load', () => {
  syncAudienceStackHeight();
  syncBodyStackHeight();
});

const pillLabels = {
  age: document.getElementById('labelAge'),
  country: document.getElementById('labelCountry'),
  gender: document.getElementById('labelGender'),
};

pillHits.forEach(hit => {
  hit.addEventListener('click', () => {
    const pill = hit.dataset.pill;
    if (pill === activePill) return;

    positionPillBg(hit);
    Object.values(audiencePanels).forEach(p => p.classList.add('hidden'));
    audiencePanels[pill].classList.remove('hidden');
    Object.values(pillLabels).forEach(l => l.style.color = '#f8f9f9');
    pillLabels[pill].style.color = '#f8f9f9';
    activePill = pill;
  });
});

function setupScrub(zoneId, dotId, tipId, points) {
  const zone = document.getElementById(zoneId);
  const dot = document.getElementById(dotId);
  const tip = document.getElementById(tipId);
  const container = zone.parentElement;

  function update(clientX) {
    const rect = zone.getBoundingClientRect();
    let x = Math.min(Math.max(clientX - rect.left, 0), rect.width);
    const pct = x / rect.width;
    const idx = Math.min(points.length - 1, Math.max(0, Math.round(pct * (points.length - 1))));
    const pt = points[idx];
    const containerRect = container.getBoundingClientRect();
    const dotX = rect.left - containerRect.left + (idx/(points.length-1)) * rect.width;
    const dotY = rect.top - containerRect.top + rect.height * pt.yPct;
    dot.style.left = dotX + 'px';
    dot.style.top = dotY + 'px';
    dot.style.display = 'block';
    tip.style.left = dotX + 'px';
    tip.style.top = dotY + 'px';
    tip.textContent = pt.label;
    tip.style.display = 'block';
  }
  function hide() {
    dot.style.display = 'none';
    tip.style.display = 'none';
  }

  zone.addEventListener('touchstart', e => { update(e.touches[0].clientX); }, {passive:true});
  zone.addEventListener('touchmove', e => { update(e.touches[0].clientX); }, {passive:true});
  zone.addEventListener('touchend', hide);
  let dragging = false;
  zone.addEventListener('mousedown', e => { dragging = true; update(e.clientX); });
  window.addEventListener('mousemove', e => { if (dragging) update(e.clientX); });
  window.addEventListener('mouseup', () => { dragging = false; hide(); });
}

// --- Double-tap to simulate a refresh/loading state ---
// Two quick taps anywhere on the stage show a shimmering skeleton over
// whichever top-level tab is currently active, then fade back to the
// real content - a lightweight "reload" simulation.
const headingSources = {
  overview: document.querySelector('#body-overview > img'),
  engagement: document.querySelector('#body-engagement > img'),
  audience_top: document.querySelector('#body-audience .audience-top > img'),
};
document.querySelectorAll('.skeleton-heading-img').forEach(el => {
  const src = headingSources[el.dataset.img];
  if (src) el.style.backgroundImage = 'url("' + src.src + '")';
});

const skeletons = {
  overview: document.getElementById('skeletonOverview'),
  engagement: document.getElementById('skeletonEngagement'),
  audience: document.getElementById('skeletonAudience'),
};
let skeletonTimer = null;

const headerSkeleton = document.getElementById('headerSkeleton');
const SKELETON_MS = 2400;

function playSkeletonLoad() {
  const overlay = skeletons[activeTab];
  if (!overlay) return;
  clearTimeout(skeletonTimer);
  overlay.classList.add('active');
  headerSkeleton.classList.add('active');
  skeletonTimer = setTimeout(() => {
    overlay.classList.remove('active');
    headerSkeleton.classList.remove('active');
  }, SKELETON_MS);
}

// Start in the same loading state as the reference screenshot.
window.addEventListener('load', () => {
  headerSkeleton.classList.add('active');
  skeletonTimer = setTimeout(() => {
    skeletons.overview.classList.remove('active');
    headerSkeleton.classList.remove('active');
  }, SKELETON_MS);
});

stage.addEventListener('dblclick', (e) => {
  e.preventDefault();
  playSkeletonLoad();
});

// Fallback manual double-tap detection for touch devices where
// 'dblclick' may not reliably fire from two taps.
let lastTapTime = 0;
stage.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTapTime < 300) {
    playSkeletonLoad();
  }
  lastTapTime = now;
}, {passive: true});
</script>
